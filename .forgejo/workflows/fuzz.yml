# Coverage-guided fuzzing of every parser (fuzz/, scripts/fuzz.sh) with
# libFuzzer. Started by hand only (Actions → fuzz → Run workflow). One run
# fuzzes for 30 minutes in total, split evenly over the targets; the
# `minutes` input changes that. Needs nightly Rust and cargo-fuzz, which the
# builder image doesn't have, so they are installed first (not counted in
# the 30 minutes).
#
# A finding fails the run and uploads fuzz/artifacts/. Reproduce it locally
# with `cargo +nightly fuzz run <target> <file>`, fix it, and commit the file
# under fuzz/regressions/<target>/ so the CI smoke test replays it.
name: fuzz

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of fuzzing in total, split over all targets
        default: "30"

env:
  CARGO_INCREMENTAL: "0"
  # cargo runs one job per core by default: on the 208-core runner that ran
  # out of the job container's 1024 open files ("Too many open files"). The
  # runner ignores a container `options: --ulimit`.
  CARGO_BUILD_JOBS: "64"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Fuzzing time plus installing the tools and building the targets.
    timeout-minutes: 90
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2
      # Build first, so the fuzzing budget isn't spent compiling.
      - name: build the fuzz targets
        run: scripts/fuzz-lock.sh && cd fuzz && cargo +nightly fuzz build -O
      - name: fuzz every target
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
        run: |
          case "$MINUTES" in
            ''|*[!0-9]*|0)
              echo "minutes must be a positive number" >&2
              exit 2
              ;;
          esac
          n=$(cd fuzz && cargo +nightly fuzz list | wc -l)
          per=$((MINUTES * 60 / n))
          # 0 would mean "no limit" to libFuzzer.
          [ "$per" -ge 1 ] || per=1
          echo "fuzzing $n targets for ${per}s each (${MINUTES} min in total)"
          scripts/fuzz.sh "$per"
      - name: keep the findings
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
