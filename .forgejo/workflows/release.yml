# Publishes a release when a version tag is pushed:
#
#   git tag -a v0.3.0      # release notes as the message
#   git push origin v0.3.0
#
# Runs the tests, then builds every target in the builder image (Linux
# x86_64 natively; Linux arm64, Windows x86_64, FreeBSD x86_64 and macOS
# arm64 and x86_64 cross-compiled) and creates the Forgejo release with
# their files, webjetup and install.sh (scripts/release.sh).
#
# Publishing uses the RELEASE_TOKEN secret if set (a Forgejo token with
# write:repository), else the workflow's automatic token.
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      # cargo starts a job per core; the default 1024 open files runs out on the
      # 208-core runner ("Too many open files").
      options: --ulimit nofile=65536
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --locked --workspace

  release:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      # cargo starts a job per core; the default 1024 open files runs out on the
      # 208-core runner ("Too many open files").
      options: --ulimit nofile=65536
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # actions/checkout fetches the tagged commit, not the tag object, so
      # the release notes (the tag's message) would be missing.
      - name: Fetch the annotated tag
        run: |
          tag="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force --depth=1 origin "+$tag:$tag"
      - name: Build, package and publish
        env:
          WEBJET_FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          WEBJET_FORGEJO_API: ${{ github.server_url }}/api/v1
          WEBJET_FORGEJO_REPO: ${{ github.repository }}
        run: |
          targets="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
          targets="$targets x86_64-pc-windows-msvc x86_64-unknown-freebsd"
          targets="$targets aarch64-apple-darwin x86_64-apple-darwin"
          scripts/release.sh "${GITHUB_REF_NAME}" --publish --targets "$targets"
