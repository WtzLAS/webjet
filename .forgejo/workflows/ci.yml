# Checks for every push and pull request: formatting, clippy (Linux and
# Windows, with and without AnyTLS) and the test suite.
#
# Runs on the `ubuntu-latest` runner, in the builder image
# (ci/builder.Dockerfile), which must be present in the runner's Docker
# daemon (docs/development.md). webjet-app is left out: GPUI needs
# X11/Wayland and Vulkan development packages the image doesn't have.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8/webjet-builder:1
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy (Linux)
        run: >
          cargo clippy --locked --workspace --exclude webjet-app
          --all-targets -- -D warnings
      - name: clippy (Linux, without AnyTLS)
        run: >
          cargo clippy --locked --workspace --exclude webjet-app
          --all-targets --no-default-features -- -D warnings
      - name: clippy (Windows)
        run: >
          cargo xwin clippy --locked --target x86_64-pc-windows-msvc
          -p webjetd -p webjet-tools -p webjetup
          --all-targets --no-default-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8/webjet-builder:1
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --locked --workspace --exclude webjet-app
