# Checks for every push and pull request: formatting, clippy (Linux with
# and without AnyTLS, Windows, FreeBSD and macOS), dependencies (cargo-deny:
# advisories, licences, sources), the test suite and the fuzz targets' smoke
# test.
#
# Runs on the `ubuntu-latest` runner, in the builder image from the private
# repository webj8-internal/webjet-builder, pulled with the secrets
# BUILDER_USER and BUILDER_TOKEN (docs/development.md). webjet-app (GPUI)
# is checked for every target, through the patched gpui in vendor/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  # cargo runs one job per core by default: on the 208-core runner that ran
  # out of the job container's 1024 open files ("Too many open files"). The
  # runner ignores a container `options: --ulimit`.
  CARGO_BUILD_JOBS: "64"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy (Linux)
        run: >
          cargo clippy --locked --workspace
          --all-targets -- -D warnings
      - name: clippy (Linux, without AnyTLS)
        run: >
          cargo clippy --locked --workspace
          --all-targets --no-default-features -- -D warnings
      - name: clippy (Windows)
        run: >
          cargo xwin clippy --locked --target x86_64-pc-windows-msvc
          -p webjetd -p webjet-tools -p webjetup -p webjet-app
          --all-targets --no-default-features -- -D warnings
      # FreeBSD (OPNsense), cross-compiled against the image's sysroot.
      - name: clippy (FreeBSD)
        run: >
          scripts/freebsd-cargo.sh clippy --locked
          -p webjetd -p webjet-tools -p webjetup -p webjet-app
          --all-targets -- -D warnings
      # macOS, cross-compiled against the image's macOS SDK.
      - name: clippy (macOS)
        run: >
          scripts/macos-cargo.sh aarch64-apple-darwin clippy --locked
          -p webjetd -p webjet-tools -p webjetup -p webjet-app
          --all-targets -- -D warnings

  dependencies:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # deny.toml; installs a pinned cargo-deny if the image has none.
      - name: cargo deny
        run: scripts/deny.sh

  test:
    runs-on: ubuntu-latest
    container:
      image: forgejo.wolf109909.top/webj8-internal/webjet-builder:5
      credentials:
        username: ${{ secrets.BUILDER_USER }}
        password: ${{ secrets.BUILDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --locked --workspace
      # Every fuzz target on its seeds and random mutations, on stable
      # (fuzz/tests/smoke.rs); the real fuzzing runs in fuzz.yml. The fuzz
      # workspace takes the main Cargo.lock (scripts/fuzz-lock.sh), so no
      # --locked: cargo adds the fuzz-only dependencies to the copy.
      - name: fuzz targets (smoke)
        run: >
          scripts/fuzz-lock.sh &&
          cargo test --release --manifest-path fuzz/Cargo.toml
          --no-default-features
      - name: clippy (fuzz targets)
        run: >
          cargo clippy --manifest-path fuzz/Cargo.toml
          --no-default-features --all-targets -- -D warnings
