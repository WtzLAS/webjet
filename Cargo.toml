[workspace]
resolver = "2"
members = ["crates/*"]
# Patched copies of crates.io crates (vendor/README.md), not ours to lint.
exclude = ["vendor"]

[workspace.package]
version = "0.11.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
# Released as binaries from Forgejo, never to crates.io.
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1.8"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
rand = "0.10"
rand_core = "0.10"
chacha20poly1305 = "0.11"
# The data path's AEAD (frames::SessionKey): the same library as rustls's
# provider, with assembly ChaCha20-Poly1305 (about 2.5x RustCrypto's).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aes-gcm = "0.11"
zeroize = { version = "1", features = ["derive"] }
subtle = "2.5"
base64 = "0.23"
hex = "0.4"
planus = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "logging", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
ipnet = "2"
clap = { version = "4", features = ["derive", "env"] }
reed-solomon-erasure = "6"
tun-rs = { version = "2.8", features = ["async_tokio"] }
hickory-proto = "0.26"
proptest = "1"
zstd = { version = "0.14", default-features = false }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }

# Production code handles every error; unwrap/expect are fine only in tests
# (see clippy.toml).
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Key files take Argon2id with 64 MiB; unoptimized, opening one in a debug
# build or a test takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# gpui's build scripts pick their steps by the build machine's OS, so the
# macOS app can't be cross-compiled on Linux with the crates.io versions.
# These copies decide by the target instead (vendor/README.md).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui_media = { path = "vendor/gpui_media" }
