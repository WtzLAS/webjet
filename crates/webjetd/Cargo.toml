[package]
name = "webjetd"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["anytls"]
anytls = ["webjet-net/anytls", "dep:boring"]

[lib]
name = "webjetd"
path = "src/lib.rs"

[[bin]]
name = "webjetd"
path = "src/main.rs"

[dependencies]
webjet-core = { path = "../webjet-core" }
webjet-proto = { path = "../webjet-proto" }
webjet-net = { path = "../webjet-net", default-features = false }
webjet-release = { path = "../webjet-release" }
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
rand.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
ipnet.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true
futures.workspace = true
hickory-proto.workspace = true
snap = "1"
tun-rs = { workspace = true }
libc = "0.2"
if-addrs = "0.15"
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
crab_nat = "0.8"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
boring = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Services", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[dev-dependencies]
webjet-core = { path = "../webjet-core", features = ["testutil"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
