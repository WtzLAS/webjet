[package]
name = "webjet-tools"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["anytls"]
anytls = ["webjetd/anytls", "webjet-net/anytls"]

[dependencies]
webjet-core = { path = "../webjet-core" }
webjet-proto = { path = "../webjet-proto" }
webjet-net = { path = "../webjet-net", default-features = false }
webjetd = { path = "../webjetd", default-features = false }
webjet-release = { path = "../webjet-release", features = ["http"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
hex.workspace = true
base64.workspace = true
ipnet.workspace = true
rand.workspace = true
zeroize.workspace = true
chacha20poly1305.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.6"
dirs = "7"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
