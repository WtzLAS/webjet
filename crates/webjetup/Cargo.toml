[package]
name = "webjetup"
description = "Installs, upgrades and removes Webjet"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
hex.workspace = true
rustls = { workspace = true }
# HTTPS with the workspace's aws-lc-rs provider (no ring) and Mozilla's roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Deleting webjetd's identity keys from the System keychain on nuke.
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
