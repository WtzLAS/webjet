[package]
name = "webjet-release"
description = "Release names, versions and remote upgrade requests, shared by webjetup, webjetd and webjetctl"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The HTTPS client for the release server (webjetup, webjetctl). webjetd
# only reads and writes the upgrade request and status files.
http = ["dep:ureq", "dep:rustls", "dep:sha2"]

[dependencies]
# The signed UpgradeRequest and AccountRecord the helper verifies itself.
webjet-core = { path = "../webjet-core" }
webjet-proto = { path = "../webjet-proto" }
base64.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rustls = { workspace = true, optional = true }
# HTTPS with the workspace's aws-lc-rs provider (no ring) and Mozilla's roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
sha2 = { version = "0.11", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
webjet-core = { path = "../webjet-core", features = ["testutil"] }

[lints]
workspace = true
