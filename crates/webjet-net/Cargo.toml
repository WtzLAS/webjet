[package]
name = "webjet-net"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["anytls"]
anytls = ["dep:boring", "dep:tokio-boring"]

[dependencies]
webjet-core = { path = "../webjet-core" }
webjet-proto = { path = "../webjet-proto" }
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
rand.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
reed-solomon-erasure.workspace = true
chacha20poly1305.workspace = true
subtle.workspace = true
futures.workspace = true
boring = { version = "5", optional = true }
tokio-boring = { version = "5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[lints]
workspace = true

[dev-dependencies]
# The crate our KCP (src/kcp/proto.rs) came from: older nodes still run it,
# so the tests check the two interoperate.
kcp = "0.6"
